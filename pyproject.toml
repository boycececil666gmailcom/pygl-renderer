[project]
name = "pygl-renderer"
version = "0.1.0"
description = "OpenGL glTF Renderer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "glfw>=2.10.2",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pyglm>=2.8.3",
    "pygltflib>=1.16.5",
    "pyopengl>=3.1.10",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
